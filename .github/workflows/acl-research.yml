name: ACL restore investigation
on:
  push:
    branches: ["codex/acl-restore-investigation"]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Independently verify native snapshot source
        run: python -B scripts/acl-query-proof.py
