name: ACL restore investigation
on:
  push:
    branches: ["codex/acl-restore-investigation"]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Exact descriptor experiments in owned temporary trees
        run: python -B scripts/acl-native-experiment.py
      - name: Backup descriptor experiments in owned temporary trees
        run: python -B scripts/acl-backup-experiment.py
